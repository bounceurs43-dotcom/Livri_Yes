<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paiement Sécurisé - Stripe</title>
    <!-- Stripe JavaScript SDK -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #eee;
        }

        .header {
            display: none;
        }

        .content {
            padding: 24px 16px;
        }

        .order-summary {
            background: #f8fff9;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            border-left: 4px solid #10AA2E;
            border-top: 1px solid #e0f2e1;
            border-right: 1px solid #e0f2e1;
            border-bottom: 1px solid #e0f2e1;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
        }

        .summary-item:not(:last-child) {
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 8px;
        }

        .summary-label {
            color: #666;
            font-weight: 500;
        }

        .summary-value {
            color: #333;
            font-weight: 600;
        }

        .summary-total {
            font-size: 18px;
            color: #10AA2E;
            font-weight: 700;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #f0f0f0;
        }

        .payment-methods {
            margin-bottom: 24px;
        }

        .method-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .method-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10AA2E;
            border-radius: 50%;
            margin-right: 10px;
        }

        .cancel-button {
            width: 100%;
            padding: 12px;
            background: white;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 16px;
        }

        .cancel-button:hover {
            background: #f5f5f5;
            color: #333;
            border-color: #ccc;
        }

        #result-message {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        #result-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        #result-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
        }

        .security-badge::before {
            content: '🔒';
            font-size: 16px;
        }

        /* Stripe specific styles */
        #payment-form {
            width: 100%;
        }

        #submit {
            background: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            border-radius: 4px;
            border: 0;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: block;
            transition: all 0.2s ease;
            box-shadow: 0px 4px 5.5px 0px rgba(0, 0, 0, 0.07);
            width: 100%;
            margin-top: 20px;
        }

        #submit:hover {
            background: #222222;
        }

        #submit:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .spinner,
        .spinner:before,
        .spinner:after {
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation-fill-mode: both;
            animation: spin 1.8s infinite ease-in-out;
        }

        .spinner {
            color: #ffffff;
            font-size: 6px;
            margin: 0 auto;
            position: relative;
            text-indent: -9999em;
            transform: translateZ(0);
            display: none;
        }

        #submit.loading .spinner {
            display: inline-block;
        }

        #submit.loading #button-text {
            display: none;
        }

        @keyframes spin {
            0% {
                box-shadow: 0 -0.83em 0 -0.4em, 0 -0.83em 0 -0.42em, 0 -0.83em 0 -0.44em;
            }

            5% {
                box-shadow: 0 -0.83em 0 -0.4em, 0 -0.83em 0 -0.42em, 0 -0.83em 0 -0.44em;
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 12px;
            }

            .header,
            .content {
                padding: 20px 16px;
            }

            .header h1 {
                font-size: 20px;
            }
        }

        #payment-element {
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <!-- CART_DATA_PLACEHOLDER -->
    <div class="container">
        <div class="header">
            <h1>Paiement Sécurisé avec Stripe</h1>
            <p>Finalisez votre commande en toute confiance</p>
        </div>

        <div class="content">
            <!-- Order Summary -->
            <div class="order-summary">
                <div class="summary-item">
                    <span class="summary-label">Sous-total</span>
                    <span class="summary-value" id="cartTotal">0.00€</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Livraison</span>
                    <span class="summary-value" id="deliveryFee">0.00€</span>
                </div>
                <div id="expressFeeContainer" class="summary-item" style="display: none;">
                    <span class="summary-label">Livraison Express</span>
                    <span class="summary-value" id="expressFee">0.00€</span>
                </div>
                <div id="tipContainer" class="summary-item" style="display: none;">
                    <span class="summary-label">Pourboire</span>
                    <span class="summary-value" id="tipAmount">0.00€</span>
                </div>
                <div class="summary-total">
                    Total: <span id="finalTotal">0.00€</span>
                </div>
            </div>

            <!-- Payment Methods -->
            <div class="payment-methods">
                <div class="method-title">Carte Bancaire / Apple Pay / Google Pay</div>

                <form id="payment-form">
                    <div id="payment-element">
                        <!-- Stripe Elements will be inserted here -->
                    </div>
                    <button id="submit">
                        <div class="spinner" id="spinner"></div>
                        <span id="button-text">Payer maintenant</span>
                    </button>
                    <div id="payment-message" class="hidden"></div>
                </form>

                <button id="cancel-button" class="cancel-button">
                    Retour au panier
                </button>
            </div>

            <div id="result-message"></div>

            <div class="security-badge">
                Paiement 100% sécurisé par Stripe
            </div>
        </div>
    </div>
    <script src="stripe_checkout.js"></script>
</body>

</html>
